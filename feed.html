<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OurCity | Community Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap wrap--wide">
    <a class="logo" href="index.html" aria-label="Our City home">
      <svg width="32" height="38" viewBox="0 0 120 130" aria-hidden="true"><path d="M60 8 C36 8 22 26 22 46 C22 74 60 118 60 118 C60 118 98 74 98 46 C98 26 84 8 60 8 Z" fill="#FF6A00" stroke="#fff" stroke-width="8" stroke-linejoin="round"/><circle cx="60" cy="46" r="15" fill="#111" stroke="#fff" stroke-width="6"/></svg>
      <span>Our <em>City</em></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a class="link" href="index.html">Home</a>
      <a class="link" href="index.html#cities">Explore your city</a>
      <a class="link is-active" href="feed.html">Feed</a>
      <div class="auth" id="authBox">
        <a href="signup.html">Sign up</a>
        <a href="login.html" class="fill">Login</a>
      </div>
    </nav>
  </div>
</header>

<main class="wrap feed">
  <section class="feed__center">

    <!-- Instagram-style: tap to share a problem -->
    <a class="sharebar card" id="shareBar" href="create.html">
      <span class="sharebar__cam" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 8 H8 L10 5 H14 L16 8 H20 V19 H4 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
      </span>
      <span class="sharebar__txt">Share a problem you saw...</span>
      <span class="sharebar__go">Post</span>
    </a>

    <form class="card searchbar" id="searchForm" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M15.5 15.5 L21 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      <input type="search" id="q" placeholder="Search by place or problem" aria-label="Search reports">
      <select id="fcat" aria-label="Filter by category"></select>
      <button type="button" class="btn btn--line" id="nearBtn">Near me</button>
    </form>
    <div class="searchinfo" id="searchInfo" hidden></div>

    <div id="posts"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="logo">Our <em>City</em></div>
    <p>An independent community platform. Not an official government site.</p>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>
<script>
/* shows any script error on the page, so problems are easy to spot */
window.addEventListener('error', function (e) {
  var d = document.getElementById('jsErr');
  if (!d) { d = document.createElement('div'); d.id = 'jsErr'; d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b00020;color:#fff;padding:10px 16px;font:600 14px monospace'; document.body.appendChild(d); }
  d.textContent = 'Page error: ' + e.message + ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')';
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/social.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
